version: 2

models:
  - name: stg_customers
    description: Staging layer - cleaned customer data
    columns:
      - name: id
        description: Customer ID
        tests:
          - unique
          - not_null
      - name: name
        description: Customer name
      - name: email
        description: Customer email
      - name: created_at
        description: Account creation date
      - name: order_amount
        description: Order amount

  - name: fct_customers
    description: Customer fact table with segmentation
    columns:
      - name: id
        description: Customer ID
        tests:
          - unique
          - not_null
      - name: order_amount
        description: Order amount
        tests:
          - not_null
