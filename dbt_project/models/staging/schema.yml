  - name: stg_matches
    description: >
      Fournir une table brute de tous les matchs sportifs disponibles, servant de
      point d'entrée pour tous les traitements liés aux performances des équipes
      et des pays. Une ligne par match unique.
    columns:
      - name: match_id
        description: Identifiant unique du match (clé primaire).
        tests:
          - not_null
          - unique

      - name: match_date
        description: Date du match au format date valide (YYYY-MM-DD).
        tests:
          - not_null

      - name: kick_off
        description: Heure de coup d'envoi du match. Optionnel, peut être NULL.

      - name: home_score
        description: Score de l'équipe domicile. Entier, valeur >= 0.
        tests:
          - not_null

      - name: away_score
        description: Score de l'équipe extérieure. Entier, valeur >= 0.
        tests:
          - not_null

      - name: match_status
        description: >
          Statut du match (ex: available, collecting). Optionnel.

      - name: match_status_360
        description: Statut 360 du match. Optionnel.

      - name: match_week
        description: Journée de championnat. Optionnel.

      - name: last_updated
        description: Datetime de la dernière mise à jour du match. Optionnel.

      - name: last_updated_360
        description: Datetime de la dernière mise à jour des données 360. Optionnel.

      - name: competition_id
        description: Identifiant de la compétition.
        tests:
          - not_null

      - name: competition_name
        description: Nom de la compétition.
        tests:
          - not_null

      - name: competition_country
        description: Pays de la compétition. Optionnel.

      - name: season_id
        description: Identifiant de la saison.
        tests:
          - not_null

      - name: season_name
        description: Nom de la saison.
        tests:
          - not_null

      - name: home_team_id
        description: Identifiant de l'équipe domicile.
        tests:
          - not_null

      - name: home_team_name
        description: Nom de l'équipe domicile. Obligatoire, non vide.
        tests:
          - not_null

      - name: home_team_gender
        description: "Genre de l'équipe domicile (ex: male, female). Optionnel."

      - name: home_team_country
        description: Pays de l'équipe domicile. Optionnel.

      - name: away_team_id
        description: Identifiant de l'équipe extérieure.
        tests:
          - not_null

      - name: away_team_name
        description: Nom de l'équipe extérieure. Obligatoire, non vide.
        tests:
          - not_null

      - name: away_team_gender
        description: "Genre de l'équipe extérieure (ex: male, female). Optionnel."

      - name: away_team_country
        description: Pays de l'équipe extérieure. Optionnel.

      - name: competition_stage_id
        description: Identifiant de la phase de compétition. Optionnel.

      - name: competition_stage_name
        description: "Nom de la phase de compétition (ex: Group Stage, Final). Optionnel."

      - name: stadium_id
        description: Identifiant du stade. Optionnel.

      - name: stadium_name
        description: Nom du stade. Optionnel.

      - name: stadium_country
        description: Pays du stade. Optionnel.

      - name: referee_id
        description: Identifiant de l'arbitre. Optionnel.

      - name: referee_name
        description: Nom de l'arbitre. Optionnel.

      - name: referee_country
        description: Pays de l'arbitre. Optionnel.

      - name: data_version
        description: Version des données source. Optionnel.
