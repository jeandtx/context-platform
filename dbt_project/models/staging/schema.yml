version: 2

models:
  - name: stg_country_codes
    description: >
      Table de référence des pays du monde pour identifier et classifier tous les pays
      utilisés dans le projet. Source : fichier de référence externe contenant les noms
      de pays et leurs codes ISO. Grain : une ligne par pays.
    columns:
      - name: country_name
        description: Nom du pays, issu de la colonne "Name" de la source brute.
        tests:
          - not_null
          - unique

      - name: code
        description: >
          Code ISO 3166-1 alpha-2 du pays (2 lettres majuscules), issu de la colonne
          "Code" de la source brute.
        tests:
          - not_null
          - unique

  - name: stg_events
    description: >
      Table brute de tous les événements sportifs qui se produisent pendant les matchs,
      permettant l'analyse détaillée du déroulement du jeu.
      Grain: une ligne par événement unique (event_id) au sein d'un match (match_id).
    columns:
      - name: event_id
        description: Identifiant unique de l'événement.
        tests:
          - not_null
          - unique

      - name: match_id
        description: Identifiant du match auquel appartient l'événement. Référence externe.
        tests:
          - not_null

      - name: event_index
        description: Index chronologique de l'événement dans le match (ordre croissant).
        tests:
          - not_null

      - name: event_type_id
        description: Identifiant numérique du type d'événement (classification StatsBomb).
        tests:
          - not_null

      - name: event_type_name
        description: "Nom du type d'événement (ex: pass, shot, dribble, foul, substitution)."
        tests:
          - not_null

      - name: period
        description: Période du match (1 ou 2 pour le temps réglementaire, 3+ pour les prolongations).
        tests:
          - not_null

      - name: minute
        description: Minute de jeu à laquelle l'événement s'est produit.
        tests:
          - not_null

      - name: second
        description: Seconde dans la minute à laquelle l'événement s'est produit.
        tests:
          - not_null

      - name: timestamp
        description: Date et heure précises de l'événement.
        tests:
          - not_null

      - name: team_id
        description: Identifiant de l'équipe associée à l'événement. Peut être NULL pour certains événements.

      - name: team_name
        description: Nom de l'équipe associée à l'événement. NULL possible.

      - name: player_id
        description: Identifiant du joueur associé à l'événement. NULL si événement collectif ou sans joueur spécifique.

      - name: player_name
        description: Nom du joueur associé à l'événement. NULL possible.

      - name: position_id
        description: Identifiant de la position du joueur sur le terrain. NULL possible.

      - name: position_name
        description: "Nom de la position du joueur (ex: Goalkeeper, Defender, Midfielder, Forward). NULL possible."

      - name: location_x
        description: Coordonnée X de la localisation de l'événement sur le terrain. NULL possible. Système de coordonnées à clarifier.

      - name: location_y
        description: Coordonnée Y de la localisation de l'événement sur le terrain. NULL possible. Système de coordonnées à clarifier.

      - name: possession_team_id
        description: Identifiant de l'équipe en possession du ballon au moment de l'événement. NULL possible.

      - name: possession_team_name
        description: Nom de l'équipe en possession du ballon au moment de l'événement. NULL possible.

      - name: play_pattern_id
        description: Identifiant numérique du motif de jeu. NULL possible.

      - name: play_pattern_name
        description: "Nom du motif de jeu (ex: Regular Play, Throw In, Corner Kick). NULL possible."

      - name: duration
        description: Durée de l'action en secondes. NULL possible.

      - name: possession
        description: Numéro de séquence de possession dans le match. NULL possible.

      - name: under_pressure
        description: Indicateur booléen signalant si l'action a été effectuée sous pression. NULL possible.

      - name: off_camera
        description: Indicateur booléen signalant si l'action s'est produite hors caméra. NULL possible.

      - name: out
        description: Indicateur booléen signalant si le ballon est sorti du terrain. NULL possible.

      - name: counterpress
        description: Indicateur booléen signalant si l'événement est un contre-pressing. NULL possible.

      - name: pass
        description: Détails structurés de l'événement si c'est une passe. NULL si l'événement n'est pas une passe.

      - name: shot
        description: Détails structurés de l'événement si c'est un tir. NULL si l'événement n'est pas un tir.

      - name: carry
        description: Détails structurés de l'événement si c'est une conduite de balle. NULL si l'événement n'est pas une conduite.

      - name: dribble
        description: Détails structurés de l'événement si c'est un dribble. NULL si l'événement n'est pas un dribble.

      - name: duel
        description: Détails structurés de l'événement si c'est un duel. NULL si l'événement n'est pas un duel.

      - name: clearance
        description: Détails structurés de l'événement si c'est un dégagement. NULL si l'événement n'est pas un dégagement.

      - name: block
        description: Détails structurés de l'événement si c'est un blocage. NULL si l'événement n'est pas un blocage.

      - name: interception
        description: Détails structurés de l'événement si c'est une interception. NULL si l'événement n'est pas une interception.

      - name: goalkeeper
        description: Détails structurés de l'événement si le gardien est impliqué. NULL sinon.

      - name: foul_committed
        description: Détails structurés de l'événement si c'est une faute commise. NULL sinon.

      - name: foul_won
        description: Détails structurés de l'événement si c'est une faute obtenue. NULL sinon.

      - name: bad_behaviour
        description: Détails structurés de l'événement si c'est un carton (mauvais comportement). NULL sinon.

      - name: ball_receipt
        description: Détails structurés de l'événement si c'est une réception de balle. NULL sinon.

      - name: ball_recovery
        description: Détails structurés de l'événement si c'est une récupération de balle. NULL sinon.

      - name: miscontrol
        description: Détails structurés de l'événement si c'est un mauvais contrôle. NULL sinon.

      - name: substitution
        description: Détails structurés de l'événement si c'est une substitution. NULL sinon.

      - name: tactics
        description: Données tactiques associées à l'événement (structure à clarifier — JSON structuré ou texte libre). NULL possible.

  - name: stg_indicators
    description: >
      Données d'indicateurs mondiaux (notamment population) par pays en format large
      (une colonne par année, 1960–2025), recopiées telles quelles depuis raw_indicators.
