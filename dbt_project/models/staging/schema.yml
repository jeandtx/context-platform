version: 2

models:
  - name: stg_customers
    description: Staging layer - cleaned customer data
    columns:
      - name: id
        description: Customer ID
        tests:
          - unique
          - not_null
      - name: name
        description: Customer name
      - name: email
        description: Customer email
      - name: created_at
        description: Account creation date
      - name: order_amount
        description: Order amount

  - name: stg_indicators
    description: Word population by countries staging layer from parquet

  - name: stg_country_codes
    description: Country codes staging layer from parquet

  - name: stg_events
    description: Sport events from open dataset staging layer from parquet

  - name: stg_matches
    description: Sport matches from open dataset staging layer from parquet
