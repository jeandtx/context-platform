version: 2

models:
  # DIMENSION TABLES
  - name: dim_countries
    description: Dimension table containing country information
    columns:
      - name: country_name
        description: The name of the country
        tests:
          - not_null
          - unique
      - name: iso2
        description: ISO 3166-1 alpha-2 country code
        tests:
          - not_null
          - unique

  - name: dim_teams
    description: Dimension table containing sports team information
    columns:
      - name: team_id
        description: Unique identifier for the team
        tests:
          - unique
          - not_null
      - name: team_name
        description: Name of the team
        tests:
          - not_null
          - unique
      - name: team_gender
        description: Gender category of the team (Male or Female)
        tests:
          - not_null
          - accepted_values:
              values: [ "male", "female" ]
      - name: team_country
        description: Country of the team
        tests:
          - not_null

  - name: dim_matches
    description: Dimension table containing sports match information
    columns:
      - name: match_id
        description: Unique identifier for the match
        tests:
          - unique
          - not_null
      - name: match_date
        description: Date when the match was played
        tests:
          - not_null
      - name: home_team
        description: Name of the home team
        tests:
          - not_null
      - name: away_team
        description: Name of the away team
        tests:
          - not_null
      - name: home_score
        description: Goals scored by the home team
        tests:
          - not_null
      - name: away_score
        description: Goals scored by the away team
        tests:
          - not_null
      - name: winner
        description: Winner of the match (home team, away team, or 'draw')
        tests:
          - not_null

  - name: dim_population
    description: Dimension table containing historical population data by country and year
    columns:
      - name: country_name
        description: The name of the country
        tests:
          - not_null
      - name: country_code
        description: ISO country code
        tests:
          - not_null
      - name: indicator_name
        description: The name of the indicator being measured (usually population)
        tests:
          - not_null
      - name: indicator_code
        description: Code for the indicator
        tests:
          - not_null
      - name: year
        description: Year of the population data
        tests:
          - not_null
      - name: population_value
        description: Population count for the country and year
        tests:
          - not_null

  - name: dim_team_country
    description: Dimension table mapping teams to their countries
    columns:
      - name: team_name
        description: Name of the team
        tests:
          - not_null
          - unique
      - name: country_name
        description: Country associated with the team
        tests:
          - not_null

  # FACT TABLES
  - name: fact_country_performance
    description: Fact table containing country performance metrics in sports matches
    columns:
      - name: country_name
        description: Country name
        tests:
          - not_null
      - name: matches_played
        description: Total number of matches played by teams from this country
        tests:
          - not_null
      - name: wins
        description: Total number of wins by teams from this country
        tests:
          - not_null

  # KPI TABLES
  - name: kpi_performance_vs_population
    description: KPI table calculating sports performance ratio relative to population
    columns:
      - name: country_name
        description: Country name
        tests:
          - not_null
      - name: wins
        description: Total wins in sports matches
        tests:
          - not_null
      - name: population_value
        description: Population of the country
        tests:
          - not_null
      - name: performance_ratio
        description: Ratio of wins to population (wins per capita metric)
        tests:
          - not_null
