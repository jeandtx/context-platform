# Name your project! Project names should be lowercase and used in folder names
# and ever used as a database schema name.
name: "dbt_poc"
version: "1.0.0"
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: "dbt_poc"

# These configurations specify where dbt should look for different types of files.
# The `src-paths` config, for example, tells dbt where to find source definitions
# in this project. Other common resource configs include:
# - macro-paths: where macros in this project are stored
# - test-paths: tests in this project
# These all default to a value, so you only need to alter them if you want to
# change their behavior.
model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target" # directory which will store compiled SQL files
clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_modules"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example_basic
# directory as tables. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.
models:
  dbt_poc:
    # Config indicated by + and applies to all files under models/
    +materialized: table
    staging:
      +materialized: view
    marts:
      +materialized: table
