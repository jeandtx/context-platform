# Ruff configuration
# Docs: https://docs.astral.sh/ruff/configuration/

line-length = 100
target-version = "py310"

[lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # Pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "ARG",  # flake8-unused-arguments
  "SIM",  # flake8-simplify
  "RUF",  # Ruff-specific rules
]

ignore = [
  "E501",  # line-too-long (handled by formatter)
  "B008",  # do-not-perform-function-calls-in-argument-defaults
]

# Exclude dbt target and other common patterns
exclude = [
  ".git",
  ".venv",
  "target",
  "dbt_project/target",
  "dbt_packages",
  "__pycache__",
]

[lint.isort]
known-first-party = ["dbt"]
known-third-party = ["dbt_core", "evidence"]

[format]
quote-style = "double"
indent-width = 4
skip-magic-trailing-comma = false
line-ending = "lf"
